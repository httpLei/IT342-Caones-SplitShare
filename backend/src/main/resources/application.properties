spring.application.name=splitshare

spring.datasource.url=${SUPABASE_DB_URL:}
spring.datasource.username=${SUPABASE_DB_USERNAME:}
spring.datasource.password=${SUPABASE_DB_PASSWORD:}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.open-in-view=false

# ── JWT ──────────────────────────────────────────────────────────────────────
# 512-bit Base64-encoded secret (change before deploying to production)
application.security.jwt.secret-key=${JWT_SECRET_KEY:}
application.security.jwt.expiration=86400000
application.security.jwt.refresh-token.expiration=604800000

# ── Server ───────────────────────────────────────────────────────────────────
server.port=${PORT:8080}
application.upload.dir=uploads

# Admin bootstrap (set to true only when you want to create/promote an admin)
application.admin.bootstrap.enabled=${ADMIN_BOOTSTRAP_ENABLED:false}
application.admin.bootstrap.email=${ADMIN_BOOTSTRAP_EMAIL:}
application.admin.bootstrap.password=${ADMIN_BOOTSTRAP_PASSWORD:}
application.admin.bootstrap.firstname=${ADMIN_BOOTSTRAP_FIRSTNAME:Super}
application.admin.bootstrap.lastname=${ADMIN_BOOTSTRAP_LASTNAME:Admin}

# Google OAuth2 login
# Create a Google OAuth client and add this authorized redirect URI:
# http://localhost:8080/login/oauth2/code/google
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID:}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET:}
spring.security.oauth2.client.registration.google.scope=openid,email,profile
application.oauth2.default-redirect-uri=${OAUTH2_DEFAULT_REDIRECT_URI:http://localhost:5173/oauth2/success}
